name: Vivx CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK & Library AAR
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Sample APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivx-sample-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Library AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivx-library-aar
          path: vivx/build/outputs/aar/*.aar
          if-no-files-found: warn
